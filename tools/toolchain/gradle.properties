# m3-forge toolchain: copied into GRADLE_USER_HOME by evals/tools/toolchain-env.mjs (withToolchain).
# GRADLE_USER_HOME properties take precedence over a project's own gradle.properties, so these limits
# hold for every Gradle build an eval run or a capture starts (owner, 2026-11-17: the machine peaked at
# 15.47 of 15.5 GB during the baseline's Compose cells).
# Phase 4 (owner, 2026-11-23, relaxed memory thresholds): smaller daemon heaps.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
# An idle daemon exits after 10 minutes instead of 3 hours, so a finished cell's daemon does not hold
# memory while the next cell runs.
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=2
