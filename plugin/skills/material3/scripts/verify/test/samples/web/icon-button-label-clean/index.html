<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lumenfold</title><link rel="stylesheet" href="app.css"></head>
<body>
  <main class="page">
    <button class="icon-btn" aria-label="Close"><span class="m3-icon">close</span></button>
    <a href="#settings" class="icon-btn" title="Settings"><span class="material-symbols-outlined" aria-hidden="true">settings</span></a>
    <div class="icon-btn" role="button" tabindex="0" aria-labelledby="menu-label"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg></div>
    <span id="menu-label" hidden>Menu</span>
    <md-icon-button aria-label="Search"><md-icon>search</md-icon></md-icon-button>
    <button class="text-btn"><span class="m3-icon">add</span> New list</button>
    <button class="text-btn">
      <span class="m3-icon">delete</span>
      <span class="label">Delete</span>
    </button>
    <button class="icon-btn"><span class="m3-icon">share</span><span class="visually-hidden">Share</span></button>
    <a href="#lists">Lists</a>
    <button class="text-btn">Save</button>
    <span class="m3-icon">home</span>
  </main>
</body>
</html>
